# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/ctf

# Terminal Connections
terminal.gateway.url=http://localhost:3001
terminal.ws.url=ws://localhost:3001

# Challenges Path (creates a 'challenges' folder inside your backend directory)
challenges.base.path=${user.dir}/challenges

# CORS for local frontend
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000

# JWT
JWT_SECRET=my-local-dev-secret-key-must-be-32-chars-long