networks:
  ctf-network:
    driver: bridge
    name: ctf-network
services:
  terminal:
    container_name: terminal
    build:
      context: ./ctf-terminal
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    networks:
      - ctf-network
    environment:
      - PORT=3001
      - USE_DOCKER_DNS=true
    restart: unless-stopped

  app:
    image: ctf-backend
    container_name: app
    build:
      context: ./ctf-backend
      dockerfile: Dockerfile
    volumes:
      - challenges_data:/app/challenges
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
    networks:
      - ctf-network
    depends_on:
      - db
      - terminal
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3002,http://inno1-bif3-p1-w25.cs.technikum-wien.at:3000,http://inno1-bif3-p1-w25.cs.technikum-wien.at,https://inno1-bif3-p1-w25.cs.technikum-wien.at}
      - DATABASE_URL=jdbc:postgresql://db:5432/ctf
      - DOCKER_HOST=unix:///var/run/docker.sock
      - TERMINAL_GATEWAY_URL=http://terminal:3001
      - TERMINAL_WS_URL=ws://terminal:3001
    command: bash -c "java -Djavax.net.ssl.trustStore=/etc/ssl/certs/java/cacerts -Djavax.net.ssl.trustStorePassword=changeit -jar app.jar"
    extra_hosts:
      - "ldap.technikum-wien.at:172.31.249.50"
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: db
    environment:
      POSTGRES_USER: ctfuser
      POSTGRES_PASSWORD: ctfpass
      POSTGRES_DB: ctf
    ports:
      - "5432:5432"
    networks:
      - ctf-network
    volumes:
      - pgdata:/var/lib/postgresql/data

  frontend:
    image: ctf-frontend
    container_name: frontend
    build:
      context: ./ctf-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    networks:
      - ctf-network
    environment:
      - API_URL=${API_URL:-http://app:8080}
      - API_PROXY_TARGET=${API_PROXY_TARGET:-http://app:8080}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
      - TERMINAL_WS_URL=${TERMINAL_WS_URL:-ws://localhost:3001}
    depends_on:
      - app
      - terminal

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    profiles:
      - sonar
    ports:
      - "9000:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs

volumes:
  pgdata:
  challenges_data:
  sonar_data:
  sonar_extensions:
  sonar_logs:
