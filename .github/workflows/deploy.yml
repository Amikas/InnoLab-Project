name: Deploy CTF Platform

on:
  push:
    branches: [master, main]

env:
  NEXT_PUBLIC_API_URL: ""
  NEXT_PUBLIC_TERMINAL_URL: ws://inno1-bif3-p1-w25.cs.technikum-wien.at/terminal
  DEPLOY_DIR: /opt/ctf

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
      - name: Debug build environment
        run: |
          echo "=== Java ==="
          java -version 2>&1
          echo "=== Maven ==="
          ./mvnw --version 2>&1
          echo "=== Workspace ==="
          pwd
          ls -la target/ 2>/dev/null || echo "No target dir"
        working-directory: ctf-backend
      - name: Build Backend
        run: ./mvnw clean package -DskipTests -Dcheckstyle.skip=true -q
        working-directory: ctf-backend

      - name: Build Frontend
        run: |
          npm ci
          npm run build
        working-directory: ctf-frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ env.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_TERMINAL_URL: ${{ env.NEXT_PUBLIC_TERMINAL_URL }}

      - name: Deploy Backend
        run: |
          BACKEND_JAR=$(find ctf-backend/target -maxdepth 1 -name "*.jar" | head -n1)
          if [ -z "$BACKEND_JAR" ]; then
            echo "ERROR: No backend JAR found"
            exit 1
          fi
          cp "$BACKEND_JAR" ${{ env.DEPLOY_DIR }}/backend/app.jar

      - name: Deploy Frontend
        run: |
          rm -rf ${{ env.DEPLOY_DIR }}/frontend/.next
          cp -r ctf-frontend/.next ${{ env.DEPLOY_DIR }}/frontend/.next
          cp -r ctf-frontend/.next/static ${{ env.DEPLOY_DIR }}/frontend/.next/standalone/.next/static

      - name: Deploy Terminal
        run: cp ctf-terminal/server.js ${{ env.DEPLOY_DIR }}/terminal/server.js

      # SECURITY: backend (ctf.ssh.password=${CTF_SSH_PASSWORD}) and the
      # terminal gateway (server.js fail-fast) both refuse to boot without
      # CTF_SSH_PASSWORD, and both must use the SAME value (the backend
      # injects it into challenge containers, the terminal SSHs in with it).
      # Fail fast here instead of taking the services down. Prefer a single
      # shared EnvironmentFile (see docs/08-deployment.md) so the value
      # cannot drift between units.
      #
      # IMPORTANT: `systemctl show -p Environment` does NOT include variables
      # loaded via EnvironmentFile= (it only reflects Environment= directives).
      # So we verify (1) that both units actually reference the shared file via
      # the EnvironmentFiles property, and (2) that the file itself contains a
      # non-empty CTF_SSH_PASSWORD. Because both units read the SAME file, the
      # value is structurally identical — no hash comparison is needed.
      # Requires passwordless sudo for `systemctl show ctf-*` and for
      # `cat /opt/ctf/ctf.env` (see docs/08-deployment.md, runner prerequisites).
      - name: Verify CTF_SSH_PASSWORD is configured and consistent
        run: |
          set -euo pipefail
          ENV_FILE=/opt/ctf/ctf.env
          # NOTE: values must be single-token (e.g. hex from openssl rand -hex
          # 32); the regex below rejects values containing whitespace.
          # All sudo calls use -n (non-interactive): the runner has no TTY, so
          # plain sudo would prompt/hang. If sudo fails here, the unit config
          # may be fine and the missing piece is the NOPASSWD sudoers rule.
          for svc in ctf-backend ctf-terminal; do
            # Anchor to the property name so e.g. a stray /opt/ctf/ctf.env.bak
            # cannot false-positive the match.
            if ! sudo -n systemctl show "$svc" -p EnvironmentFiles --no-pager | grep -qE "^EnvironmentFiles=$ENV_FILE"; then
              echo "ERROR: $svc does not load EnvironmentFile=$ENV_FILE."
              echo "Either the unit lacks the EnvironmentFile line, or the runner"
              echo "lacks NOPASSWD sudo for 'systemctl show ctf-*' (see docs/08-deployment.md)."
              echo "Fix on the host, then rerun the deploy:"
              echo '  sudo systemctl edit ctf-backend   # EnvironmentFile=/opt/ctf/ctf.env'
              echo '  sudo systemctl edit ctf-terminal  # EnvironmentFile=/opt/ctf/ctf.env'
              echo '  sudo systemctl daemon-reload'
              exit 1
            fi
          done
          if ! sudo -n cat "$ENV_FILE" | grep -qE '^CTF_SSH_PASSWORD=[^[:space:]]+$'; then
            echo "ERROR: $ENV_FILE has no valid CTF_SSH_PASSWORD (non-empty, single token)."
            echo "Either the file is missing/empty/malformed, or the runner lacks"
            echo "NOPASSWD sudo for 'cat /opt/ctf/ctf.env' (see docs/08-deployment.md)."
            echo "Fix on the host, then rerun the deploy:"
            echo '  sudo nano /opt/ctf/ctf.env   # add: CTF_SSH_PASSWORD=<strong-password>'
            echo '  sudo chmod 600 /opt/ctf/ctf.env'
            exit 1
          fi
          echo "CTF_SSH_PASSWORD set in $ENV_FILE and referenced by ctf-backend and ctf-terminal units"

      - name: Restart Services
        run: sudo systemctl restart ctf-backend ctf-frontend ctf-terminal

      - name: Health Check
        run: |
          echo "--- Frontend ---"
          FRONTEND_OK=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null; then
              FRONTEND_OK=true
              echo "Frontend: OK"
              break
            fi
            sleep 1
          done
          if [ "$FRONTEND_OK" = false ]; then
            echo "Frontend: FAIL (timeout after 30s)"
            exit 1
          fi
          echo "--- Terminal ---"
          TERMINAL_OK=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/health > /dev/null; then
              TERMINAL_OK=true
              echo "Terminal: OK"
              break
            fi
            sleep 1
          done
          if [ "$TERMINAL_OK" = false ]; then
            echo "Terminal: FAIL (timeout after 30s)"
            exit 1
          fi
          echo "--- Backend ---"
          BACKEND_OK=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/health > /dev/null; then
              BACKEND_OK=true
              echo "Backend: OK"
              break
            fi
            sleep 1
          done
          if [ "$BACKEND_OK" = false ]; then
            echo "Backend: FAIL (timeout after 30s)"
            exit 1
          fi
          echo "All services healthy!"
