name: Deploy CTF Platform

on:
  push:
    branches: [master, main]

env:
  NEXT_PUBLIC_API_URL: ""
  NEXT_PUBLIC_TERMINAL_URL: ws://inno1-bif3-p1-w25.cs.technikum-wien.at/terminal
  DEPLOY_DIR: /opt/ctf

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
      - name: Debug build environment
        run: |
          echo "=== Java ==="
          java -version 2>&1
          echo "=== Maven ==="
          ./mvnw --version 2>&1
          echo "=== Workspace ==="
          pwd
          ls -la target/ 2>/dev/null || echo "No target dir"
        working-directory: ctf-backend
      - name: Build Backend
        run: ./mvnw clean package -DskipTests -Dcheckstyle.skip=true -q
        working-directory: ctf-backend

      - name: Build Frontend
        run: |
          npm ci
          npm run build
        working-directory: ctf-frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ env.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_TERMINAL_URL: ${{ env.NEXT_PUBLIC_TERMINAL_URL }}

      - name: Deploy Backend
        run: |
          BACKEND_JAR=$(find ctf-backend/target -maxdepth 1 -name "*.jar" | head -n1)
          if [ -z "$BACKEND_JAR" ]; then
            echo "ERROR: No backend JAR found"
            exit 1
          fi
          cp "$BACKEND_JAR" ${{ env.DEPLOY_DIR }}/backend/app.jar

      - name: Deploy Frontend
        run: |
          rm -rf ${{ env.DEPLOY_DIR }}/frontend/.next
          cp -r ctf-frontend/.next ${{ env.DEPLOY_DIR }}/frontend/.next
          cp -r ctf-frontend/.next/static ${{ env.DEPLOY_DIR }}/frontend/.next/standalone/.next/static

      - name: Deploy Terminal
        run: cp ctf-terminal/server.js ${{ env.DEPLOY_DIR }}/terminal/server.js

      # SECURITY: backend (ctf.ssh.password=${CTF_SSH_PASSWORD}) and the
      # terminal gateway (server.js fail-fast) both refuse to boot without
      # CTF_SSH_PASSWORD. It must be present in the systemd units BEFORE the
      # new binaries are deployed; fail fast here instead of taking the
      # services down.
      # Both units must use the SAME non-empty value: the backend injects it
      # into challenge containers and the terminal uses it to SSH in.
      - name: Verify CTF_SSH_PASSWORD is configured
        run: |
          for svc in ctf-backend ctf-terminal; do
            if ! sudo systemctl show "$svc" -p Environment --no-pager | grep -q 'CTF_SSH_PASSWORD=[^ ]'; then
              echo "ERROR: $svc has no non-empty CTF_SSH_PASSWORD in its systemd environment."
              echo "Configure it on the host first, then rerun the deploy:"
              echo "  sudo systemctl edit $svc"
              echo '    [Service]'
              echo '    Environment="CTF_SSH_PASSWORD=<strong-password>"'
              echo '  sudo systemctl daemon-reload'
              exit 1
            fi
          done
          echo "CTF_SSH_PASSWORD set in ctf-backend and ctf-terminal units"

      - name: Restart Services
        run: sudo systemctl restart ctf-backend ctf-frontend ctf-terminal

      - name: Health Check
        run: |
          echo "--- Frontend ---"
          FRONTEND_OK=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null; then
              FRONTEND_OK=true
              echo "Frontend: OK"
              break
            fi
            sleep 1
          done
          if [ "$FRONTEND_OK" = false ]; then
            echo "Frontend: FAIL (timeout after 30s)"
            exit 1
          fi
          echo "--- Terminal ---"
          TERMINAL_OK=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/health > /dev/null; then
              TERMINAL_OK=true
              echo "Terminal: OK"
              break
            fi
            sleep 1
          done
          if [ "$TERMINAL_OK" = false ]; then
            echo "Terminal: FAIL (timeout after 30s)"
            exit 1
          fi
          echo "--- Backend ---"
          BACKEND_OK=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/health > /dev/null; then
              BACKEND_OK=true
              echo "Backend: OK"
              break
            fi
            sleep 1
          done
          if [ "$BACKEND_OK" = false ]; then
            echo "Backend: FAIL (timeout after 30s)"
            exit 1
          fi
          echo "All services healthy!"
